<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In &bull; CollabSpace</title>
  <!-- Google Fonts: Roboto & Material Symbols -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0">
  
  <!-- Material You CSS Architecture -->
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="../assets/css/components.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px;">

  <!-- Organic Blur Backdrop -->
  <div class="organic-backdrop" aria-hidden="true">
    <div class="organic-blob organic-blob--primary"></div>
    <div class="organic-blob organic-blob--secondary"></div>
    <div class="organic-blob organic-blob--tertiary"></div>
  </div>

  <!-- Theme Toggle Floating -->
  <div style="position: fixed; top: 20px; right: 24px; z-index: 10;">
    <button class="btn-icon" data-action="toggle-theme" aria-label="Toggle dark mode">
      <span class="material-symbols-rounded" data-theme-icon>dark_mode</span>
    </button>
  </div>

  <!-- Login Card Container -->
  <main class="card hero-container" style="max-width: 480px; width: 100%; z-index: 1; padding: 40px 36px; border-radius: var(--md-radius-xxl);">
    <div style="text-align: center; margin-bottom: 28px;">
      <div style="display: inline-flex; align-items: center; justify-content: center; width: 56px; height: 56px; border-radius: var(--md-radius-md); background: linear-gradient(135deg, var(--md-primary) 0%, var(--md-tertiary) 100%); color: #fff; margin-bottom: 12px; box-shadow: var(--md-elev-2);">
        <span class="material-symbols-rounded" style="font-size: 32px;">hub</span>
      </div>
      <h1 class="type-headline-m" style="font-weight: 700; margin-bottom: 4px;">CollabSpace</h1>
      <p class="type-body-s">Sign in to your team collaboration workspace</p>
    </div>

    <!-- Quick Demo Logins Chip Bar -->
    <div style="margin-bottom: 24px; background: var(--md-surface-container-low); padding: 14px 16px; border-radius: var(--md-radius-md);">
      <div class="type-label-s" style="color: var(--md-on-surface-variant); margin-bottom: 8px; font-weight: 500;">
        Quick Demo Sign-In (Password: Test@1234):
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 6px;">
        <button type="button" class="chip chip--priority-high" style="cursor: pointer; border: none;" data-demo-user="alex.owner@collabspace.dev">
          <span class="material-symbols-rounded">admin_panel_settings</span> Alex (Owner)
        </button>
        <button type="button" class="chip chip--priority-medium" style="cursor: pointer; border: none;" data-demo-user="sarah.admin@collabspace.dev">
          <span class="material-symbols-rounded">manage_accounts</span> Sarah (Admin)
        </button>
        <button type="button" class="chip chip--priority-low" style="cursor: pointer; border: none;" data-demo-user="mike.member@collabspace.dev">
          <span class="material-symbols-rounded">person</span> Mike (Member)
        </button>
      </div>
    </div>

    <!-- Login Form -->
    <form id="form-login">
      <div class="input-field">
        <label class="input-field__label" for="login-email">Email Address</label>
        <input class="input-field__control" type="email" id="login-email" required placeholder="alex.owner@collabspace.dev" autocomplete="email">
      </div>

      <div class="input-field">
        <label class="input-field__label" for="login-password">Password</label>
        <input class="input-field__control" type="password" id="login-password" required placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" autocomplete="current-password">
      </div>

      <button type="submit" class="btn btn--filled btn--lg" style="width: 100%; margin-top: 8px;">
        <span class="material-symbols-rounded">login</span> Sign In
      </button>
    </form>

    <div style="text-align: center; margin-top: 24px;" class="type-body-s">
      Don't have an account yet? 
      <a href="register.html" style="font-weight: 500;">Create Account</a>
    </div>
  </main>

  <!-- JavaScript Modules -->
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // Check if already authenticated
      const auth = await App.initAuth(false);
      if (auth) {
        window.location.href = 'dashboard.html';
        return;
      }

      // Demo login filler buttons
      document.querySelectorAll('[data-demo-user]').forEach(btn => {
        btn.addEventListener('click', () => {
          document.getElementById('login-email').value = btn.getAttribute('data-demo-user');
          document.getElementById('login-password').value = 'Test@1234';
          document.getElementById('form-login').dispatchEvent(new Event('submit'));
        });
      });

      // Handle submit
      const form = document.getElementById('form-login');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('login-email').value.trim();
        const password = document.getElementById('login-password').value;

        const res = await App.apiFetch('../api/auth.php?action=login', {
          method: 'POST',
          body: { email, password }
        });

        if (res.success) {
          UI.showToast('Login successful! Redirecting...', 'success');
          setTimeout(() => {
            window.location.href = 'dashboard.html';
          }, 400);
        } else {
          UI.showToast(res.error || 'Invalid email or password', 'error');
        }
      });
    });
  </script>
</body>
</html>
