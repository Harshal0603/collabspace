<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register &bull; CollabSpace</title>
  <!-- Google Fonts: Roboto & Material Symbols -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0">
  
  <!-- Material You CSS Architecture -->
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="../assets/css/components.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px;">

  <!-- Organic Blur Backdrop -->
  <div class="organic-backdrop" aria-hidden="true">
    <div class="organic-blob organic-blob--primary"></div>
    <div class="organic-blob organic-blob--secondary"></div>
    <div class="organic-blob organic-blob--tertiary"></div>
  </div>

  <!-- Theme Toggle Floating -->
  <div style="position: fixed; top: 20px; right: 24px; z-index: 10;">
    <button class="btn-icon" data-action="toggle-theme" aria-label="Toggle dark mode">
      <span class="material-symbols-rounded" data-theme-icon>dark_mode</span>
    </button>
  </div>

  <!-- Register Card Container -->
  <main class="card hero-container" style="max-width: 480px; width: 100%; z-index: 1; padding: 40px 36px; border-radius: var(--md-radius-xxl);">
    <div style="text-align: center; margin-bottom: 28px;">
      <div style="display: inline-flex; align-items: center; justify-content: center; width: 56px; height: 56px; border-radius: var(--md-radius-md); background: linear-gradient(135deg, var(--md-primary) 0%, var(--md-tertiary) 100%); color: #fff; margin-bottom: 12px; box-shadow: var(--md-elev-2);">
        <span class="material-symbols-rounded" style="font-size: 32px;">person_add</span>
      </div>
      <h1 class="type-headline-m" style="font-weight: 700; margin-bottom: 4px;">Join CollabSpace</h1>
      <p class="type-body-s">Create your account and personal workspace in seconds</p>
    </div>

    <!-- Registration Form -->
    <form id="form-register">
      <div class="input-field">
        <label class="input-field__label" for="reg-name">Full Name</label>
        <input class="input-field__control" type="text" id="reg-name" required placeholder="Elena Rostova" autocomplete="name">
      </div>

      <div class="input-field">
        <label class="input-field__label" for="reg-email">Work Email</label>
        <input class="input-field__control" type="email" id="reg-email" required placeholder="elena@company.com" autocomplete="email">
      </div>

      <div class="input-field">
        <label class="input-field__label" for="reg-password">Password</label>
        <input class="input-field__control" type="password" id="reg-password" required minlength="6" placeholder="Min. 6 characters" autocomplete="new-password">
        <span class="input-field__hint">Use at least 6 characters</span>
      </div>

      <button type="submit" class="btn btn--filled btn--lg" style="width: 100%; margin-top: 8px;">
        <span class="material-symbols-rounded">rocket_launch</span> Get Started
      </button>
    </form>

    <div style="text-align: center; margin-top: 24px;" class="type-body-s">
      Already have an account? 
      <a href="login.html" style="font-weight: 500;">Sign In</a>
    </div>
  </main>

  <!-- JavaScript Modules -->
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // Check if already authenticated
      const auth = await App.initAuth(false);
      if (auth) {
        window.location.href = 'dashboard.html';
        return;
      }

      const form = document.getElementById('form-register');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = document.getElementById('reg-name').value.trim();
        const email = document.getElementById('reg-email').value.trim();
        const password = document.getElementById('reg-password').value;

        const res = await App.apiFetch('../api/auth.php?action=register', {
          method: 'POST',
          body: { name, email, password }
        });

        if (res.success) {
          UI.showToast('Account created successfully!', 'success');
          setTimeout(() => {
            window.location.href = 'dashboard.html';
          }, 400);
        } else {
          UI.showToast(res.error || 'Failed to create account', 'error');
        }
      });
    });
  </script>
</body>
</html>
